# ============================================================================
# Chatbot WhatsApp Mob2Con
#
# Sobe 4 serviços: Postgres, Redis, Evolution API (v2 Node, sem trava de
# licença) e o bot em Python.
#
# Segurança aplicada de fábrica:
#   - portas publicadas só em 127.0.0.1 (nada exposto na internet)
#   - chave da API gerada aleatoriamente (nunca a chave pública de exemplo)
#   - telemetria desligada
#   - CORS restrito
#   - persistência de mensagens desligada (o banco não incha)
#   - instâncias não são expostas no fetchInstances
#
# Uso:
#   python scripts/gerar_env.py
#   docker compose up -d
#   python scripts/setup_instancia.py
# ============================================================================

name: mob2con-chatbot

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chatbot]

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chatbot]

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: chatbot-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # só localhost: para expor de verdade, use proxy reverso com HTTPS
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      # --- segurança
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      CORS_ORIGIN: http://localhost:8080
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      TELEMETRY_ENABLED: "false"

      # --- banco
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: mob2con_chatbot
      # guarda apenas o essencial: sessão da instância.
      # ligar o resto faz o Postgres crescer sem limite.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      # --- cache
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: mob2con
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # --- operação
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
      QRCODE_LIMIT: "30"
    volumes:
      - evolution-instancias:/evolution/instances
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://127.0.0.1:8080 >/dev/null 2>&1 || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [chatbot]

  bot:
    build: .
    container_name: chatbot-bot
    restart: unless-stopped
    depends_on:
      evolution-api:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # dentro da rede do compose o host é o nome do serviço
      EVOLUTION_URL: http://evolution-api:8080
      REDIS_URL: redis://redis:6379/1
    networks: [chatbot]

volumes:
  postgres-dados:
  redis-dados:
  evolution-instancias:

networks:
  chatbot:
    driver: bridge
