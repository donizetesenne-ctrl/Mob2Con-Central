<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mob2Con — Template Operacional (1280 × 720)</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../mob2con.css">
  <style>body{padding:24px;}</style>
</head>
<body>
  <h1 class="m2c-page-title">Template Operacional — 1280 × 720</h1>
  <p class="m2c-label">Monitoramento diário, equipes operacionais, muitos filtros</p>

  <div class="m2c-canvas m2c-canvas--operational">
    <div class="m2c-visual" style="left:0;top:0;width:1280px;height:80px;border-radius:0;border:none;border-bottom:var(--m2c-border-card);">
      <div class="m2c-visual__title" style="border:none;display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 16px;">
        <span class="m2c-page-title">Operacional Mob2Con</span>
        <div class="m2c-row"><span class="m2c-label">Filtros:</span><button class="m2c-btn m2c-btn--secondary" style="height:32px">Período</button><button class="m2c-btn m2c-btn--secondary" style="height:32px">Região</button></div>
      </div>
    </div>
    <div class="m2c-kpi m2c-kpi--orange" style="position:absolute;left:20px;top:80px;width:308px;height:120px;">
      <div class="m2c-kpi__title">KPI 1</div><div class="m2c-kpi__value" style="font-size:22pt">R$ 320K</div>
    </div>
    <div class="m2c-kpi" style="position:absolute;left:340px;top:80px;width:308px;height:120px;border-top:3px solid var(--m2c-blue-connect);">
      <div class="m2c-kpi__title">KPI 2</div><div class="m2c-kpi__value" style="font-size:22pt">85%</div>
    </div>
    <div class="m2c-kpi" style="position:absolute;left:660px;top:80px;width:308px;height:120px;border-top:3px solid var(--m2c-purple);">
      <div class="m2c-kpi__title">KPI 3</div><div class="m2c-kpi__value" style="font-size:22pt">1.847</div>
    </div>
    <div class="m2c-kpi" style="position:absolute;left:980px;top:80px;width:280px;height:120px;border-top:3px solid var(--m2c-success);">
      <div class="m2c-kpi__title">KPI 4</div><div class="m2c-kpi__value" style="font-size:22pt">98%</div>
    </div>
    <div class="m2c-visual" style="left:20px;top:216px;width:620px;height:340px;">
      <div class="m2c-visual__title">Gráfico Principal</div>
      <div class="m2c-visual__body"><div class="m2c-placeholder">Line/Bar Chart 620 × 300</div></div>
    </div>
    <div class="m2c-visual" style="left:656px;top:216px;width:604px;height:340px;">
      <div class="m2c-visual__title">Tabela Lateral</div>
      <div class="m2c-visual__body"><div class="m2c-placeholder">Matrix 604 × 300</div></div>
    </div>
    <div class="m2c-visual" style="left:20px;top:572px;width:620px;height:130px;">
      <div class="m2c-visual__title">Rodapé 1</div><div class="m2c-visual__body"><div class="m2c-placeholder">620 × 90</div></div>
    </div>
    <div class="m2c-visual" style="left:656px;top:572px;width:604px;height:130px;">
      <div class="m2c-visual__title">Rodapé 2</div><div class="m2c-visual__body"><div class="m2c-placeholder">604 × 90</div></div>
    </div>
  </div>

  <p style="margin-top:24px;"><a href="../index.html">← voltar</a></p>
</body>
</html>
